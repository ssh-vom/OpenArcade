services:
  configurator:
    command: >-
      npm run build -- --mode development --outDir build/orb &&
      npm run preview -- --host 0.0.0.0 --port "$PORT" --strictPort --outDir build/orb
    cwd: config_app
    port: 4173
    health: /
    env:
      VITE_MOCK_API: "true"
    portal:
      url: /
      title: OpenArcade Configurator
      description: Interactive controller configurator running with the mock device API.
